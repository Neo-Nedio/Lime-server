Name: auth
ListenOn: 0.0.0.0:8080
ConfigCenter:
  Etcd:
    Hosts: [127.0.0.1:2379]
    Key: lime/config/auth-rpc

# auth RPC 运行配置模板：由 etcd 按需返回，用于覆盖本地默认值。
#
# Name: auth
# ListenOn: 0.0.0.0:8080
#
# Etcd:
#   Hosts:
#   - 127.0.0.1:2379
#   Key: lime/auth.rpc
#
# PostgreSQL:
#   DSN: postgres://REPLACE_USER:REPLACE_PASSWORD@127.0.0.1:5432/lime?sslmode=disable
#   MaxOpenConns: 10
#   MaxIdleConns: 5
#
# Redis:
#   Host: 127.0.0.1:6379
#   Type: node
#   Pass: REPLACE_REDIS_PASSWORD
#
# Mailer:
#   Host: smtp.example.invalid
#   Port: 587
#   Username: REPLACE_SMTP_USERNAME
#   Password: REPLACE_SMTP_PASSWORD
#   From: no-reply@example.invalid
#
# JWT:
#   AccessSecret: REPLACE_JWT_ACCESS_SECRET
#   RefreshSecret: REPLACE_JWT_REFRESH_SECRET
#   AccessExpire: 900
#   RefreshExpire: 2592000
